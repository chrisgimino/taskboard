<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Bridge</title>
<script>try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Oswald:wght@500;600;700&family=Michroma&family=Exo+2:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #16181d; --muted: #6b7280; --line: #e3e5ea;
    --accent: #2f5bea; --accent-ink: #ffffff; --ok: #1f8a4c; --ok-bg: #e6f4ec;
    --warn: #b26a00; --warn-bg: #fff3dc; --bad: #c62828; --bad-bg: #fdecec; --chip: #eef0f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --ink: #e8eaef; --muted: #9aa1ad; --line: #2a2f38;
      --accent: #6d8dff; --accent-ink: #0f1115; --ok: #4cc27f; --ok-bg: #12301f;
      --warn: #f0b04a; --warn-bg: #33270f; --bad: #ff6b6b; --bad-bg: #3a1616; --chip: #232731;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 48px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 8px;
    border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .linkbtn { background: none; border: 0; color: var(--accent); padding: 4px 0; white-space: nowrap; }
  header .wrap { padding-bottom: 0; }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pill { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .pill.bad { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  nav { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  nav button { border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
  nav button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
  .filters button { border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .filters button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
  .task { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .task.overdue { border-left-color: var(--bad); background: var(--bad-bg); }
  .task.critical { border-left-color: var(--bad); }
  .task.closed { opacity: .72; }
  .task.done { border-left-color: var(--ok); }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .meta .due { font-weight: 600; color: var(--ink); }
  .task.overdue .meta .due { color: var(--bad); }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; }
  .chip.crit { background: var(--bad); color: #fff; }
  .name { font-weight: 600; margin: 4px 0 2px; }
  .note { font-size: 13px; color: var(--muted); }
  .res { font-size: 13px; color: var(--muted); }
  .feed { border-top: 1px solid var(--line, rgba(127,127,127,.25)); padding: 10px 2px; }
  .feed .ftext { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .feed .flink { font-size: 13px; color: var(--accent); }
  .nflrep { padding: 12px 14px; margin: 10px 0; }
  .nflrep .rep-h { font-size: 14px; margin: 14px 0 6px; color: var(--accent); }
  .nflrep .rep-l { font-size: 14px; padding: 5px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .res a { color: var(--accent); }
  .people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .person { border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .person.me { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .person.me:active { transform: scale(.97); }
  .person.closer { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .person.closer.skipped, .person.closer.missed { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .small { font-size: 12px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 6px; padding: 3px 8px; }
  #paused { cursor: pointer; text-decoration: underline; }
  .action { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 600; }
  .action[disabled] { opacity: .6; }
  .astatus { font-size: 12px; color: var(--muted); }
  .astatus.ok { color: var(--ok); } .astatus.bad { color: var(--bad); }
  pre { white-space: pre-wrap; font-size: 11px; background: var(--chip); padding: 8px; border-radius: 6px; max-height: 180px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px; text-align: right; border-bottom: 1px solid var(--line); font-size: 14px; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); padding: 16px; text-align: center; background: var(--card); border-radius: 10px; }
  .login { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
  .login input { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink); font-size: 16px; }
  .login button { width: 100%; padding: 12px; margin-top: 8px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 8px; }
  /* ---- schedule timeline / heat map / news desk ---- */
  body.wide .wrap { max-width: none; }
  :root {
    --sp-football: #2a78d6; --sp-basketball: #eb6834; --sp-baseball: #1baf7a; --sp-hockey: #eda100;
    --sp-soccer: #e87ba4; --sp-golf: #008300; --sp-mma: #6250d6; --sp-tennis: #e34948; --sp-other: #8a8f98;
    --h1: #cde2fb; --h2: #9ec5f4; --h3: #6da7ec; --h4: #3987e5; --h5: #256abf; --h6: #104281;
    --h-ink-dark: #0b1a2e; --now: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sp-football: #3987e5; --sp-basketball: #d95926; --sp-baseball: #199e70; --sp-hockey: #c98500;
      --sp-soccer: #d55181; --sp-golf: #008300; --sp-mma: #9085e9; --sp-tennis: #e66767; --sp-other: #6b717c;
      --h1: #12294a; --h2: #184f95; --h3: #256abf; --h4: #3987e5; --h5: #6da7ec; --h6: #b7d3f6;
      --h-ink-dark: #0b1a2e; --now: #ff6b6b;
    }
  }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0 8px; }
  .bar .day { font-weight: 700; font-size: 16px; min-width: 150px; text-align: center; }
  .bar input[type=date] { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); color: var(--ink); padding: 4px 10px; font-size: 13px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .tl { position: relative; overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .tl-inner { position: relative; }
  .tl-axis, .tl-row { display: flex; }
  .tl-label { position: sticky; left: 0; z-index: 3; flex: 0 0 var(--lw, 120px); background: var(--card); border-right: 1px solid var(--line);
    padding: 6px 8px; font-size: 13px; font-weight: 600; display: flex; align-items: flex-start; gap: 6px; }
  .tl-label .sw { width: 4px; align-self: stretch; border-radius: 2px; }
  .tl-label .cnt { color: var(--muted); font-weight: 400; font-size: 12px; }
  .tl-track { position: relative; flex: 0 0 auto; border-bottom: 1px solid var(--line); }
  .tl-axis .tl-track { height: 26px; }
  .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); font-size: 11px; color: var(--muted); padding: 5px 0 0 4px; white-space: nowrap; }
  .grid-line { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); opacity: .7; }
  .gchip { position: absolute; height: 22px; line-height: 20px; font-size: 12px; white-space: nowrap; padding: 0 7px 0 9px;
    background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; overflow: hidden; }
  .gchip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--sp-other)); }
  .gchip:hover, .gchip.sel { border-color: var(--accent); }
  .lock { position: absolute; top: 3px; width: 11px; height: 11px; transform: translateX(-5.5px) rotate(45deg); background: var(--card);
    border: 2px solid var(--muted); cursor: pointer; }
  .lock.def { border-color: var(--accent); background: var(--accent); }
  .lock.sl::after { content: "SL"; position: absolute; transform: rotate(-45deg); left: 9px; top: -9px; font-size: 9px; font-weight: 700; color: var(--accent); }
  .now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--now); z-index: 2; pointer-events: none; }
  .now span { position: absolute; bottom: 2px; left: 4px; background: var(--card); padding: 0 3px; border-radius: 3px; font-size: 10px; font-weight: 700; color: var(--now); white-space: nowrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 8px 2px; align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
  .legend i.d { transform: rotate(45deg); border: 2px solid var(--muted); width: 8px; height: 8px; }
  .legend i.d.def { border-color: var(--accent); background: var(--accent); }
  .detail { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .detail h3 { margin: 0 0 6px; font-size: 14px; }
  .detail ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px;
    border-radius: 6px; max-width: 320px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .heat { overflow: auto; max-height: 70vh; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; }
  .heat table { border-collapse: separate; border-spacing: 2px; background: none; width: auto; }
  .heat th, .heat td { border: 0; padding: 0; font-size: 11px; text-align: center; }
  .heat thead th { position: sticky; top: 0; background: var(--card); color: var(--muted); z-index: 2; padding: 4px 0; min-width: 34px; }
  .heat th.dl { position: sticky; left: 0; background: var(--card); z-index: 3; text-align: left; padding: 0 8px; white-space: nowrap; color: var(--ink); font-weight: 600; }
  .heat td.c { width: 34px; height: 24px; border-radius: 4px; background: var(--bg); cursor: pointer; color: var(--h-ink-dark); font-weight: 600; }
  .heat td.c.l1 { background: var(--h1); } .heat td.c.l2 { background: var(--h2); } .heat td.c.l3 { background: var(--h3); color: #fff; }
  .heat td.c.l4 { background: var(--h4); color: #fff; } .heat td.c.l5 { background: var(--h5); color: #fff; } .heat td.c.l6 { background: var(--h6); color: #fff; }
  @media (prefers-color-scheme: dark) { .heat td.c.l1, .heat td.c.l2 { color: #e8eaef; } .heat td.c.l5, .heat td.c.l6 { color: #0b1a2e; } }
  .heat td.c:hover { outline: 2px solid var(--accent); }
  .heat tr.today th.dl { color: var(--accent); }
  .scale { display: inline-flex; gap: 2px; align-items: center; }
  .scale b { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }
  .desk { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-top: 10px; }
  .col { flex: 0 0 360px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column;
    max-height: calc(100vh - 230px); }
  .col h3 { margin: 0; padding: 8px 12px; font-size: 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .col h3 .cnt { color: var(--muted); font-weight: 400; }
  .col .body { overflow-y: auto; padding: 0 10px 8px; }
  .col .body h2 { margin: 12px 0 6px; }
  .col .news-task { border-left: 3px solid var(--bad); background: var(--bad-bg); padding: 6px 8px; margin: 8px 0; border-radius: 6px; font-size: 13px; }
  .col .news-task.done { border-left-color: var(--ok); background: var(--ok-bg); opacity: .75; }
  .col .feed .ftext { font-size: 13px; }
  dialog.modal { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); padding: 16px 18px;
    width: min(520px, calc(100vw - 32px)); box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  dialog.modal::backdrop { background: rgba(0,0,0,.45); }
  dialog.modal h3 { margin: 0 0 10px; font-size: 16px; }
  dialog.modal label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  dialog.modal input:not([type=checkbox]), dialog.modal textarea { display: block; width: 100%; margin-top: 3px; padding: 8px; font: inherit; font-size: 14px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  dialog.modal .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  dialog.modal .chk { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 14px; margin-top: 12px; }
  dialog.modal ol.steps { margin: 0; padding-left: 22px; max-height: 60vh; overflow-y: auto; }
  dialog.modal ol.steps li { margin: 6px 0; line-height: 1.4; font-size: 14px; }
  dialog.modal ol.steps a, dialog.modal .res a { word-break: break-all; }

  /* ================= WAR ROOM theme (Chris, 2026-11-12): NFL draft-room command center ================= */
  :root {
    --bg: #05080f; --card: #0c1322; --card2: #111b30; --ink: #eef2fa; --muted: #8c98b3; --line: #1d2a45;
    --accent: #f2b705; --accent-ink: #0a0f1a; --ok: #2fd27a; --ok-bg: rgba(47,210,122,.10);
    --warn: #ffb020; --warn-bg: rgba(255,176,32,.10); --bad: #ff3b3b; --bad-bg: rgba(255,59,59,.09); --chip: #16223b;
    --red: #d50a0a; --glow: rgba(255,59,59,.45);
    --sp-football: #3987e5; --sp-basketball: #f26b2a; --sp-baseball: #1fbf86; --sp-hockey: #e0a100;
    --sp-soccer: #e0609a; --sp-golf: #23a455; --sp-mma: #9085e9; --sp-tennis: #ff6b6b; --sp-other: #6b7690;
    --h1: #12294a; --h2: #184f95; --h3: #256abf; --h4: #3987e5; --h5: #6da7ec; --h6: #b7d3f6;
    --now: #ff3b3b; color-scheme: dark;
    --f-head: "Oswald", "Bebas Neue", Impact, sans-serif;
    --f-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  html, body { font-family: var(--f-body); background: var(--bg); }
  body {
    background:
      radial-gradient(1200px 500px at 50% -120px, rgba(57,135,229,.18), transparent 70%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 100% 32px,
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px) 0 0 / 32px 100%,
      var(--bg);
    background-attachment: fixed; min-height: 100vh;
  }
  .wrap { max-width: 980px; }

  /* header: broadcast bar */
  header { background: linear-gradient(180deg, #0b1426 0%, #070c18 100%); border-bottom: 0;
    box-shadow: 0 1px 0 #1d2a45, 0 3px 0 var(--red), 0 10px 30px rgba(0,0,0,.5); padding: 10px 0 0; }
  .top { align-items: center; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .badge { flex: 0 0 auto; width: 42px; height: 46px; display: grid; place-items: center;
    background: linear-gradient(180deg, #13306b, #0a1a3d); border: 2px solid #c9d3ea;
    clip-path: polygon(50% 0, 100% 14%, 100% 62%, 50% 100%, 0 62%, 0 14%);
    font: 700 15px/1 var(--f-head); color: #fff; letter-spacing: .04em; }
  h1 { font: 600 24px/1 var(--f-head); letter-spacing: .08em; text-transform: uppercase; margin: 0; }
  h1 .live { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; vertical-align: 3px;
    font: 600 11px/1 var(--f-head); letter-spacing: .14em; color: #fff; background: var(--red); padding: 3px 7px 3px 6px; border-radius: 3px; }
  h1 .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .sub { font-size: 12px; color: var(--muted); margin-top: 3px; letter-spacing: .02em; }
  .clock { text-align: right; line-height: 1; }
  .clock #clockTime { font: 600 26px/1 var(--f-mono); color: var(--accent); letter-spacing: .04em;
    text-shadow: 0 0 14px rgba(242,183,5,.35); font-variant-numeric: tabular-nums; }
  .clock #clockDay { font: 500 11px/1 var(--f-head); letter-spacing: .18em; color: var(--muted); margin-top: 5px; text-transform: uppercase; }
  .hdr-actions { display: flex; gap: 14px; align-items: center; }
  .linkbtn { color: var(--muted); font: 500 12px/1 var(--f-head); letter-spacing: .1em; text-transform: uppercase; }
  .linkbtn:hover { color: var(--accent); }

  /* stat tiles */
  .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .stat { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 10px 6px; position: relative; overflow: hidden; }
  .stat b { display: block; font: 600 26px/1 var(--f-head); color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat span { display: block; font: 500 10px/1 var(--f-head); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .stat::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--line); }
  .stat.bad { border-color: rgba(255,59,59,.5); box-shadow: inset 0 0 22px rgba(255,59,59,.12); }
  .stat.bad b { color: var(--bad); } .stat.bad::after { background: var(--bad); }
  .stat.ok b { color: var(--ok); } .stat.ok::after { background: var(--ok); }
  .stat.gold::after { background: var(--accent); }

  /* tabs */
  nav { gap: 0; margin-top: 12px; border-top: 1px solid var(--line); }
  nav button { background: none; border: 0; border-radius: 0; color: var(--muted); padding: 11px 14px 10px;
    font: 500 13px/1 var(--f-head); letter-spacing: .12em; text-transform: uppercase; position: relative; }
  nav button:hover { color: var(--ink); }
  nav button.on { background: none; color: #fff; }
  nav button.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; background: var(--accent);
    box-shadow: 0 0 10px rgba(242,183,5,.6); }
  #newsCount { color: var(--bad); }

  /* filter chips */
  .filters button, .seg button { background: var(--card); border-color: var(--line); color: var(--muted);
    font: 500 12px/1 var(--f-head); letter-spacing: .1em; text-transform: uppercase; padding: 7px 12px; }
  .filters button.on, .seg button.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .seg { border-color: var(--line); }

  /* section headers: chyron */
  h2 { display: flex; align-items: center; gap: 10px; font: 600 14px/1 var(--f-head); letter-spacing: .18em; color: #dfe6f5;
    margin: 22px 0 10px; }
  h2::before { content: ""; width: 4px; height: 16px; background: var(--accent); flex: 0 0 auto; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  h2.hot::before { background: var(--bad); box-shadow: 0 0 10px var(--glow); }
  h2.hot { color: var(--bad); }
  h2 .note, h2 .linkbtn { letter-spacing: .1em; }

  /* cards: draft-board tiles */
  .task { position: relative; background: linear-gradient(180deg, var(--card2) 0%, var(--card) 100%);
    border: 1px solid var(--line); border-left: 0; border-radius: 6px; padding: 12px 14px 12px 18px; margin-bottom: 10px;
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 6px 18px rgba(0,0,0,.35); }
  .task::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 6px 0 0 6px;
    background: var(--c, var(--sp-other)); }
  .task:hover { border-color: #2b3c60; }
  .task.overdue { background: linear-gradient(180deg, #1b0f16 0%, #120b12 100%); border-color: rgba(255,59,59,.55);
    box-shadow: 0 0 0 1px rgba(255,59,59,.15), 0 0 24px rgba(255,59,59,.18); }
  .task.overdue::before, .task.critical::before { background: var(--bad); }
  .task.closed { opacity: .55; }
  .task.done::before { background: var(--ok); }
  .meta { gap: 8px; font-size: 11px; letter-spacing: .04em; }
  .meta .due { font: 600 13px/1 var(--f-mono); color: var(--accent); background: rgba(242,183,5,.08);
    border: 1px solid rgba(242,183,5,.3); padding: 3px 7px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .task.overdue .meta .due { color: #fff; background: var(--red); border-color: var(--red); }
  .chip { background: var(--chip); color: #c8d2e8; border-radius: 3px; padding: 3px 7px; font: 500 11px/1 var(--f-head);
    letter-spacing: .12em; text-transform: uppercase; }
  .chip.crit { background: var(--red); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(213,10,10,.25); } }
  .name { font: 600 17px/1.3 var(--f-body); color: #fff; margin: 9px 0 3px; letter-spacing: -.005em; }
  .note, .res { color: var(--muted); font-size: 13px; }
  .res a, .feed .flink, a { color: #7fb2ff; }
  .people { gap: 6px; margin-top: 10px; }
  .person { border-color: var(--line); background: rgba(255,255,255,.02); color: var(--muted); border-radius: 4px;
    font: 500 12px/1 var(--f-head); letter-spacing: .08em; text-transform: uppercase; padding: 7px 10px; }
  .person.me { border-color: var(--accent); color: var(--accent); background: rgba(242,183,5,.07); }
  .person.me:hover { background: var(--accent); color: var(--accent-ink); }
  .person.closer { background: var(--ok-bg); border-color: rgba(47,210,122,.5); color: var(--ok); }
  .person.closer.skipped, .person.closer.missed { background: var(--warn-bg); border-color: rgba(255,176,32,.5); color: var(--warn); }
  .small { background: transparent; border-color: var(--line); color: var(--muted); border-radius: 4px;
    font: 500 11px/1 var(--f-head); letter-spacing: .1em; text-transform: uppercase; padding: 6px 9px; }
  .small:hover { color: var(--ink); border-color: #3a4d75; }
  .action { background: var(--accent); color: var(--accent-ink); border-radius: 4px; font: 600 12px/1 var(--f-head);
    letter-spacing: .1em; text-transform: uppercase; padding: 8px 12px; }

  /* feed: wire ticker */
  .feed { border-top: 1px solid var(--line); padding: 10px 4px; }
  .feed .meta .due { font-size: 12px; }
  .feed .ftext { color: #d6deef; font-size: 14px; }
  .empty { background: var(--card); border: 1px dashed var(--line); color: var(--muted); border-radius: 6px;
    font: 500 12px/1.4 var(--f-head); letter-spacing: .12em; text-transform: uppercase; }

  /* scoreboard / tables: big board */
  table { background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  th { font: 500 11px/1 var(--f-head); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); background: #0a1120; padding: 10px 8px; }
  td { font: 500 14px/1 var(--f-mono); font-variant-numeric: tabular-nums; border-color: var(--line); padding: 10px 8px; }
  td:first-child { font: 600 14px/1 var(--f-body); }
  tbody tr:nth-child(odd) td { background: rgba(255,255,255,.015); }
  tbody tr:first-child td { color: var(--accent); }

  /* columns, timeline, modals */
  .col, .tl, .heat, .detail { background: var(--card); border-color: var(--line); border-radius: 6px; }
  .col h3 { font: 600 14px/1 var(--f-head); letter-spacing: .14em; text-transform: uppercase; background: #0a1120; padding: 11px 12px; }
  .tl-label, .heat thead th, .heat th.dl { background: var(--card); }
  dialog.modal { background: var(--card); border-color: var(--line); border-radius: 8px; }
  dialog.modal h3 { font: 600 18px/1.2 var(--f-head); letter-spacing: .06em; text-transform: uppercase; }
  .nflrep .rep-h { font: 600 13px/1 var(--f-head); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }

  /* sign in */
  .login { margin-top: 14vh; background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line);
    border-top: 3px solid var(--red); border-radius: 8px; padding: 26px 22px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .login h1 { font-size: 28px; }
  .login input { background: #070c18; border-color: var(--line); }
  .login button { background: var(--accent); color: var(--accent-ink); font: 600 15px/1 var(--f-head); letter-spacing: .14em; text-transform: uppercase; }

  h1 { white-space: nowrap; }
  @media (max-width: 600px) {
    .top { flex-wrap: wrap; row-gap: 8px; }
    .top > div:last-child { width: 100%; justify-content: space-between; }
    .clock { display: flex; align-items: baseline; gap: 8px; text-align: left; }
    .clock #clockDay { display: none; }
    h1 { font-size: 20px; } .badge { width: 34px; height: 38px; font-size: 12px; }
    .clock #clockTime { font-size: 18px; } .hdr-actions { gap: 12px; }
    .summary { gap: 6px; } .stat b { font-size: 20px; } .stat { padding: 6px 8px 5px; }
    nav button { padding: 10px 10px 9px; font-size: 12px; }
  }

  /* site logos (2026-11-12) */
  .badge-img { width: 46px; height: 46px; border-radius: 10px; flex: 0 0 auto;
    box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 0 18px rgba(57,135,229,.35); }
  .netbar { background: #03060c; border-bottom: 1px solid #16213a; margin: -10px 0 10px; }
  .rail { display: flex; align-items: center; justify-content: flex-end; gap: 14px; height: 34px; }
  .rail img { height: 22px; width: auto; border-radius: 5px; opacity: .8; transition: opacity .15s;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  .rail img.wide { height: 18px; }
  .rail img:hover { opacity: 1; }
  .rg-tile { height: 22px; min-width: 30px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 5px;
    background: linear-gradient(180deg, #13306b, #0a1a3d); box-shadow: 0 0 0 1px rgba(201,211,234,.5);
    font: 700 12px/1 var(--f-head); letter-spacing: .06em; color: #fff; opacity: .9; }
  @media (max-width: 600px) { .rg-tile { height: 18px; font-size: 10px; min-width: 24px; } }
  .login-badge { width: 64px; height: 64px; border-radius: 14px; display: block; margin: 0 0 14px;
    box-shadow: 0 0 24px rgba(57,135,229,.4); }
  @media (max-width: 600px) { .rail { justify-content: center; gap: 10px; } .rail img { height: 18px; } .rail img.wide { height: 15px; } }
  /* checklist task */
  .ck-count { font: 600 12px/1 var(--f-mono); color: var(--accent); }
  .ck-bar { height: 4px; background: var(--chip); border-radius: 2px; margin: 8px 0 4px; overflow: hidden; }
  .ck-bar i { display: block; height: 100%; background: var(--ok); }
  .ck-list summary { cursor: pointer; font: 500 12px/1 var(--f-head); letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); padding: 8px 0; }
  .ck { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; align-items: center; padding: 7px 4px;
    border-top: 1px solid var(--line); cursor: pointer; }
  .ck input { width: 16px; height: 16px; accent-color: var(--ok); }
  .ck-l { font-weight: 600; } .ck-d { font: 500 12px/1 var(--f-mono); color: var(--muted); text-align: right; }
  .ck-by { grid-column: 2 / 4; font-size: 11px; color: var(--ok); }
  .ck.on .ck-l { color: var(--muted); text-decoration: line-through; }
  /* countdown */
  .clock #cdLabel { font: 500 10px/1 var(--f-head); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .clock #clockTime.soon { color: var(--bad); text-shadow: 0 0 14px var(--glow); }
  .clock #clockDay { text-transform: none; letter-spacing: .04em; font: 500 11px/1.2 var(--f-body); }
  .clock #cdDiff { font: 500 11px/1.2 var(--f-body); color: var(--accent); margin-top: 3px; min-height: 13px; }
  .cd-sports { display: flex; gap: 4px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
  .cd-sports button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 3px;
    font: 500 10px/1 var(--f-head); letter-spacing: .1em; padding: 4px 6px; }
  .cd-sports button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  @media (max-width: 600px) {
    .clock { flex-wrap: wrap; } .clock #cdLabel { margin: 0; } .clock #clockDay { display: block !important; }
    .cd-sports { justify-content: flex-start; width: 100%; }
  }
  /* compact countdown (2026-11-12) */
  .clock .cd-row { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .clock .cd-row2 { display: flex; gap: 8px; justify-content: flex-end; margin-top: 3px; white-space: nowrap; }
  .clock #clockTime { font-size: 20px !important; }
  .clock #cdLabel { margin: 0 !important; }
  .clock #clockDay { margin: 0 !important; font: 500 11px/1.2 var(--f-body) !important; letter-spacing: .02em !important; }
  .clock #cdDiff { margin: 0 !important; min-height: 0 !important; }
  .cd-sports { margin: 0 !important; flex-wrap: nowrap !important; }
  .cd-sports button { padding: 3px 5px !important; }
  @media (max-width: 600px) {
    .clock { display: block !important; width: 100%; }
    .clock .cd-row { justify-content: flex-start; flex-wrap: nowrap; }
    .clock .cd-row2 { justify-content: flex-start; flex-wrap: wrap; white-space: normal; gap: 2px 8px; }
    .clock #clockTime { font-size: 17px !important; }
    .clock #cdLabel { white-space: nowrap; letter-spacing: .08em !important; }
    .cd-sports { width: auto !important; overflow-x: auto; }
    .top > div:last-child { flex-wrap: wrap; row-gap: 6px; }
  }
  /* compact task cards (Chris, 2026-11-12): as little height per task as possible */
  .task.compact { padding: 6px 10px 6px 14px; margin-bottom: 5px; box-shadow: 0 1px 0 rgba(255,255,255,.03) inset; }
  .task.compact::before { width: 4px; }
  .task.compact .t1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .task.compact .due { font: 600 12px/1 var(--f-mono); color: var(--accent); background: rgba(242,183,5,.08);
    border: 1px solid rgba(242,183,5,.3); padding: 2px 5px; border-radius: 3px; font-variant-numeric: tabular-nums; }
  .task.compact.overdue .due { color: #fff; background: var(--red); border-color: var(--red); }
  .task.compact .chip { padding: 2px 5px; font-size: 10px; }
  .task.compact .name { font: 600 14px/1.25 var(--f-body); margin: 0; flex: 1 1 240px; min-width: 0; }
  .task.compact .t2 { font-size: 12px; line-height: 1.3; margin-top: 2px; }
  .task.compact .t2 .note { font-size: 12px; }
  .task.compact .t3 { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .task.compact .t3 .person { padding: 4px 7px; font-size: 11px; }
  .task.compact .t3 .small { padding: 4px 6px; font-size: 10px; }
  .task.compact .t3 .action { padding: 5px 9px; font-size: 11px; }
  .task.compact .t3 .small:first-of-type { margin-left: 4px; }
  .task.checklist { padding: 8px 10px 8px 14px; margin-bottom: 5px; }
  .task.checklist .name { font-size: 14px; margin: 4px 0 2px; }
  @media (min-width: 900px) {   /* desktop: buttons on the right of the name line, one row per task */
    .task.compact { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; align-items: center; }
    .task.compact .t1 { grid-column: 1; grid-row: 1; }
    .task.compact .t3 { grid-column: 2; grid-row: 1 / span 2; margin-top: 0; justify-content: flex-end; }
    .task.compact .t2 { grid-column: 1; grid-row: 2; }
  }
  @media (max-width: 600px) { .task.compact .name { flex-basis: 100%; } }
  /* ================= THE BRIDGE theme (Chris, 2026-11-12): retro-futurist starship, white / gray / black ================= */
  :root, :root[data-theme] {
    --bg: #eceef1; --card: #ffffff; --card2: #fafbfc; --ink: #0d0f12; --muted: #6b7178; --line: #d3d7dc;
    --accent: #0d0f12; --accent-ink: #ffffff; --ok: #1f8a5a; --ok-bg: rgba(31,138,90,.08);
    --warn: #b06b00; --warn-bg: rgba(176,107,0,.08); --bad: #d4110f; --bad-bg: rgba(212,17,15,.05); --chip: #e9ecef;
    --red: #d4110f; --glow: rgba(212,17,15,.25); --signal: #d4110f;
    --sp-football: #3c6fb0; --sp-basketball: #d9672b; --sp-baseball: #2e9a72; --sp-hockey: #4b5560;
    --sp-soccer: #b8507f; --sp-golf: #3a8a4f; --sp-mma: #6c5fc7; --sp-tennis: #c24b4b; --sp-other: #9aa0a6;
    --h1: #e4e7ea; --h2: #c9ced3; --h3: #a3aab1; --h4: #6f777f; --h5: #3f454b; --h6: #15181b; --h-ink-dark: #ffffff;
    --now: #d4110f; color-scheme: light;
    --f-head: "Michroma", "Eurostile", "Microgramma", "Orbitron", sans-serif;
    --f-body: "Exo 2", "Eurostile", -apple-system, "Segoe UI", sans-serif;
    --f-mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
  }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--f-body); }
  body {
    background:
      radial-gradient(1400px 600px at 50% -200px, #ffffff, transparent 70%),
      linear-gradient(rgba(13,15,18,.035) 1px, transparent 1px) 0 0 / 100% 40px,
      linear-gradient(90deg, rgba(13,15,18,.03) 1px, transparent 1px) 0 0 / 40px 100%,
      var(--bg);
    background-attachment: fixed;
  }
  /* header: bridge console */
  header { background: linear-gradient(180deg, #ffffff 0%, #f1f3f5 100%); box-shadow: 0 1px 0 var(--line), 0 3px 0 #0d0f12, 0 12px 30px rgba(13,15,18,.08); }
  .netbar { background: #0d0f12; border-bottom: 0; }
  .rail img { opacity: .9; }
  h1 { font: 400 22px/1 var(--f-head); letter-spacing: .32em; color: var(--ink); text-transform: uppercase; }
  h1 .live { font: 400 9px/1 var(--f-head); letter-spacing: .2em; background: #0d0f12; color: #fff; border-radius: 999px; padding: 4px 9px 4px 8px; vertical-align: 4px; }
  h1 .live::before { background: var(--signal); box-shadow: 0 0 6px var(--signal); }
  .tagline { font: 400 9px/1 var(--f-head); letter-spacing: .5em; color: var(--muted); text-transform: uppercase; margin-top: 7px; }
  .sub { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .linkbtn { color: var(--muted); font: 400 10px/1 var(--f-head); letter-spacing: .2em; }
  .linkbtn:hover { color: var(--ink); }
  /* countdown: black readout panel */
  .clock { background: #0d0f12; border-radius: 3px 14px 3px 14px; padding: 7px 12px; box-shadow: inset 0 0 0 1px #2a2e33, 0 4px 14px rgba(13,15,18,.18); }
  .clock #clockTime { font: 400 22px/1 var(--f-mono) !important; color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,.35); letter-spacing: .08em; }
  .clock #cdLabel { color: #8b9097; font-family: var(--f-head); font-size: 8px; letter-spacing: .3em; }
  .clock #clockDay { color: #c3c7cc !important; font-family: var(--f-body) !important; }
  .clock #cdDiff { color: #ff4d4b; font-family: var(--f-body); }
  .cd-sports button { border-color: #3a3f45; color: #9aa0a6; font: 400 8px/1 var(--f-head); letter-spacing: .15em; border-radius: 999px; }
  .cd-sports button.on { background: #ffffff; border-color: #ffffff; color: #0d0f12; }
  /* stat tiles: instrument panels */
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 2px 12px 2px 12px; box-shadow: 0 1px 0 #fff inset, 0 3px 10px rgba(13,15,18,.05); }
  .stat b { font: 400 24px/1 var(--f-head); color: var(--ink); letter-spacing: .04em; }
  .stat span { font: 400 8px/1 var(--f-head); letter-spacing: .3em; color: var(--muted); margin-top: 7px; }
  .stat::after { background: var(--line); height: 2px; }
  .stat.bad { border-color: rgba(212,17,15,.35); box-shadow: none; } .stat.bad b { color: var(--bad); } .stat.bad::after { background: var(--bad); }
  .stat.ok b { color: var(--ink); } .stat.ok::after { background: var(--ok); }
  .stat.gold::after { background: #0d0f12; }
  /* tabs */
  nav { border-top: 1px solid var(--line); }
  nav button { color: var(--muted); font: 400 10px/1 var(--f-head); letter-spacing: .24em; padding: 13px 14px 12px; }
  nav button:hover { color: var(--ink); }
  nav button.on { color: var(--ink); }
  nav button.on::after { background: #0d0f12; box-shadow: none; height: 2px; }
  #newsCount { color: var(--bad); }
  .filters button, .seg button { background: #fff; border-color: var(--line); color: var(--muted); font: 400 9px/1 var(--f-head); letter-spacing: .2em; border-radius: 999px; }
  .filters button.on, .seg button.on { background: #0d0f12; border-color: #0d0f12; color: #fff; }
  /* section headers */
  h2 { font: 400 11px/1 var(--f-head); letter-spacing: .34em; color: var(--ink); }
  h2::before { background: #0d0f12; width: 10px; height: 2px; }
  h2::after { background: linear-gradient(90deg, var(--line), transparent); }
  h2.hot, h2.hot::before { color: var(--bad); } h2.hot::before { background: var(--bad); box-shadow: none; }
  /* task cards: white hull panels */
  .task, .task.compact { background: var(--card); border: 1px solid var(--line); border-radius: 2px 10px 2px 10px;
    box-shadow: 0 1px 0 #fff inset, 0 2px 6px rgba(13,15,18,.05); }
  .task:hover { border-color: #aab0b6; }
  .task::before { border-radius: 2px 0 0 2px; width: 3px !important; }
  .task.overdue { background: #fff; border-color: rgba(212,17,15,.45); box-shadow: inset 3px 0 0 var(--bad), 0 2px 8px rgba(212,17,15,.08); }
  .task.closed { opacity: .5; }
  .name, .task.compact .name { color: var(--ink); font-family: var(--f-body); font-weight: 600; letter-spacing: .01em; }
  .task.compact .due, .meta .due { font: 400 12px/1 var(--f-mono); color: #fff; background: #0d0f12; border: 0; border-radius: 2px; padding: 3px 6px; letter-spacing: .04em; }
  .task.compact.overdue .due, .task.overdue .meta .due { background: var(--bad); color: #fff; }
  .chip { background: var(--chip); color: #3f454b; font: 400 8px/1 var(--f-head); letter-spacing: .18em; border-radius: 999px; padding: 4px 7px; }
  .task.compact .chip { font-size: 8px; padding: 4px 7px; }
  .chip.crit { background: var(--bad); color: #fff; animation: none; }
  .note, .res { color: var(--muted); }
  .res a, .feed .flink, a { color: #2b5c9e; }
  .person { background: #fff; border-color: var(--line); color: var(--muted); font: 400 9px/1 var(--f-head); letter-spacing: .16em; border-radius: 999px; }
  .task.compact .t3 .person { font-size: 9px; padding: 5px 9px; }
  .person.me { border-color: #0d0f12; color: #0d0f12; background: #fff; }
  .person.me:hover { background: #0d0f12; color: #fff; }
  .person.closer { background: var(--ok-bg); border-color: rgba(31,138,90,.4); color: var(--ok); }
  .person.closer.skipped, .person.closer.missed { background: var(--warn-bg); border-color: rgba(176,107,0,.4); color: var(--warn); }
  .small, .task.compact .t3 .small { background: transparent; border-color: transparent; color: #8b9097; font: 400 8px/1 var(--f-head); letter-spacing: .2em; border-radius: 999px; }
  .small:hover { color: var(--ink); border-color: var(--line); }
  .action, .task.compact .t3 .action { background: #0d0f12; color: #fff; border-radius: 999px; font: 400 9px/1 var(--f-head); letter-spacing: .18em; }
  .feed { border-color: var(--line); } .feed .ftext { color: var(--ink); }
  .empty { background: #fff; border: 1px dashed var(--line); color: var(--muted); font: 400 9px/1.6 var(--f-head); letter-spacing: .24em; }
  table { background: #fff; border-color: var(--line); }
  th { background: #0d0f12; color: #c3c7cc; font: 400 8px/1 var(--f-head); letter-spacing: .24em; }
  td { color: var(--ink); border-color: var(--line); font-family: var(--f-mono); }
  td:first-child { font-family: var(--f-body); }
  tbody tr:nth-child(odd) td { background: #f7f8f9; } tbody tr:first-child td { color: var(--ink); font-weight: 700; }
  .col, .tl, .heat, .detail { background: #fff; border-color: var(--line); }
  .col h3 { background: #0d0f12; color: #fff; font: 400 10px/1 var(--f-head); letter-spacing: .24em; }
  .tl-label, .heat thead th, .heat th.dl { background: #fff; color: var(--ink); }
  dialog.modal { background: #fff; color: var(--ink); border-color: var(--line); border-radius: 3px 16px 3px 16px; }
  dialog.modal h3 { font: 400 13px/1.3 var(--f-head); letter-spacing: .2em; }
  .nflrep .rep-h { color: var(--ink); font: 400 10px/1 var(--f-head); letter-spacing: .24em; }
  .ck-list summary { font: 400 9px/1 var(--f-head); letter-spacing: .2em; color: var(--muted); }
  .login { background: #fff; border: 1px solid var(--line); border-top: 3px solid #0d0f12; border-radius: 3px 18px 3px 18px; box-shadow: 0 20px 50px rgba(13,15,18,.12); }
  .login h1 { font-size: 22px; }
  .login input { background: #f4f5f7; border-color: var(--line); color: var(--ink); }
  .login button { background: #0d0f12; color: #fff; font: 400 11px/1 var(--f-head); letter-spacing: .3em; border-radius: 999px; }
  input, select, textarea { color: var(--ink); }
  @media (max-width: 600px) {
    h1 { font-size: 17px; letter-spacing: .24em; } .tagline { font-size: 8px; letter-spacing: .4em; }
    .clock { padding: 6px 10px; } .clock #clockTime { font-size: 18px !important; }
    .stat b { font-size: 18px; } nav button { font-size: 9px; padding: 11px 10px; }
  }
  /* ---- The Bridge, dark mode: night-cycle bridge (black hull, gray panels, white readouts) ---- */
  :root[data-theme="dark"] {
    --bg: #0a0b0d; --card: #15171a; --card2: #191c20; --ink: #e8eaed; --muted: #8a9097; --line: #2a2e33;
    --accent: #e8eaed; --accent-ink: #0a0b0d; --ok: #3fbf86; --ok-bg: rgba(63,191,134,.10);
    --warn: #e0a040; --warn-bg: rgba(224,160,64,.10); --bad: #ff4b48; --bad-bg: rgba(255,75,72,.07); --chip: #24282d;
    --red: #e3201d; --glow: rgba(255,75,72,.3); --signal: #ff4b48;
    --sp-hockey: #9aa3ad; --sp-other: #5d636a;
    --h1: #1a1d21; --h2: #2c3137; --h3: #4a5159; --h4: #7c848c; --h5: #b5bbc1; --h6: #eef0f2; --h-ink-dark: #0a0b0d;
    color-scheme: dark;
  }
  [data-theme="dark"] body {
    background: radial-gradient(1400px 600px at 50% -200px, #1c1f23, transparent 70%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 100% 40px,
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px) 0 0 / 40px 100%, var(--bg);
    background-attachment: fixed; }
  [data-theme="dark"] header { background: linear-gradient(180deg, #16181b 0%, #0f1113 100%);
    box-shadow: 0 1px 0 var(--line), 0 3px 0 #e8eaed, 0 12px 30px rgba(0,0,0,.5); }
  [data-theme="dark"] .netbar { background: #000; border-bottom: 1px solid #1d2024; }
  [data-theme="dark"] h1 .live { background: #e8eaed; color: #0a0b0d; }
  [data-theme="dark"] .clock { background: #000; box-shadow: inset 0 0 0 1px #34393f, 0 4px 14px rgba(0,0,0,.5); }
  [data-theme="dark"] .stat { box-shadow: none; }
  [data-theme="dark"] .stat.gold::after, [data-theme="dark"] nav button.on::after, [data-theme="dark"] h2::before { background: #e8eaed; }
  [data-theme="dark"] h2.hot::before { background: var(--bad); }
  [data-theme="dark"] .filters button, [data-theme="dark"] .seg button { background: var(--card); }
  [data-theme="dark"] .filters button.on, [data-theme="dark"] .seg button.on { background: #e8eaed; border-color: #e8eaed; color: #0a0b0d; }
  [data-theme="dark"] .task, [data-theme="dark"] .task.compact { box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 2px 8px rgba(0,0,0,.4); }
  [data-theme="dark"] .task:hover { border-color: #454b52; }
  [data-theme="dark"] .task.overdue { background: #1a1314; border-color: rgba(255,75,72,.45); }
  [data-theme="dark"] .task.compact .due, [data-theme="dark"] .meta .due { background: #e8eaed; color: #0a0b0d; }
  [data-theme="dark"] .task.compact.overdue .due, [data-theme="dark"] .task.overdue .meta .due { background: var(--bad); color: #fff; }
  [data-theme="dark"] .chip { color: #b5bbc1; }
  [data-theme="dark"] .res a, [data-theme="dark"] .feed .flink, [data-theme="dark"] a { color: #8fb4e8; }
  [data-theme="dark"] .person { background: transparent; }
  [data-theme="dark"] .person.me { border-color: #e8eaed; color: #e8eaed; background: transparent; }
  [data-theme="dark"] .person.me:hover { background: #e8eaed; color: #0a0b0d; }
  [data-theme="dark"] .action, [data-theme="dark"] .task.compact .t3 .action { background: #e8eaed; color: #0a0b0d; }
  [data-theme="dark"] .empty, [data-theme="dark"] table, [data-theme="dark"] .col, [data-theme="dark"] .tl,
  [data-theme="dark"] .heat, [data-theme="dark"] .detail, [data-theme="dark"] .tl-label, [data-theme="dark"] .heat thead th,
  [data-theme="dark"] .heat th.dl, [data-theme="dark"] dialog.modal { background: var(--card); color: var(--ink); }
  [data-theme="dark"] th, [data-theme="dark"] .col h3 { background: #000; }
  [data-theme="dark"] tbody tr:nth-child(odd) td { background: #191c20; }
  [data-theme="dark"] .login { background: var(--card); border-top-color: #e8eaed; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
  [data-theme="dark"] .login input { background: #0f1113; }
  [data-theme="dark"] .login button { background: #e8eaed; color: #0a0b0d; }
  .clock #cdLabel, .hdr-actions .linkbtn { white-space: nowrap; }
  .hdr-actions { gap: 12px; }
  @media (min-width: 900px) { #subline { white-space: nowrap; } }
  .hidden { display: none !important; }
</style>
</head>

    <button type="submit" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>

</div>

<dialog id="addTask" class="modal">
  <form method="dialog" id="addTaskForm">
    <h3>Add a one-time task</h3>
    <label>Task<input id="atName" required maxlength="200" placeholder="What needs doing"></label>
    <div class="two">
      <label>Sport<input id="atSport" list="atSports" maxlength="20" placeholder="General"></label>
      <label>Category<input id="atCat" maxlength="40" placeholder="One-time"></label>
    </div>
    <datalist id="atSports"></datalist>
    <div class="two">
      <label>Day<input id="atDate" type="date" required></label>
      <label>Due time (ET, optional)<input id="atTime" type="time"></label>
    </div>

    <div class="two">
      <label>Link name<input id="atL1" maxlength="60" placeholder="e.g. NBA Sheet"></label>
      <label>Link URL<input id="atU1" type="url" placeholder="https://"></label>
    </div>
    <div class="two">
      <label>Link name<input id="atL2" maxlength="60"></label>
      <label>Link URL<input id="atU2" type="url" placeholder="https://"></label>

      <button type="button" class="small" id="atCancel">Cancel</button>
      <button type="submit" class="action" id="atSave">Add task</button>
    </div>
  </form>
</dialog>

<script>
// ---- configuration -------------------------------------------------------------
const API = "https://libet75snx5exjbgn6ds6k2bve0iyvhn.lambda-url.us-east-1.on.aws/";   // board Lambda function URL
const REFRESH_MS = 150000;          // normal refresh: 2.5 min
const CRUNCH_REFRESH_MS = 60000;    // within CRUNCH_MS before a default slate lock: 1 min
const CRUNCH_MS = 90 * 60000;
const IDLE_MS = 15 * 60000;         // no mouse / key / scroll / touch for 15 min: pause
const QUIET_START = 1, QUIET_END = 6;  // no auto-refresh 1-6 AM ET (daylight saving handled by the ET zone)
const TICK_MS = 15000;              // how often the page checks the rules above (no network)
const JOB_CHECK_MS = 60000;         // run-button job status checks
const TZ = "America/New_York";

// ---- small helpers ---------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
// light / dark toggle (Chris, 2026-11-12); remembered per browser, light by default
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  store.set("theme", t);
  const b = document.getElementById("themeBtn");
  if (b) b.textContent = t === "dark" ? "Light" : "Dark";
}
document.getElementById("themeBtn").addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
setTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }) : "";
const fmtDate = (iso) => new Date(iso).toLocaleDateString("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric" });

let state = null;
let tab = store.get("tab") || "all";
let sportFilter = store.get("sport") || "";
let showClosed = false;
const running = {};   // task_id -> {command_id, status, stdout, stderr}

async function api(payload) {
  const token = store.get("token");
  const res = await fetch(API, { method: "POST", body: JSON.stringify({ ...payload, token }) });  // text/plain: no preflight
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && payload.op !== "login") { signOut(); throw new Error(data.error || "Please sign in again"); }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ---- sign in -------------------------------------------------------------------
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  $("loginBtn").disabled = true;
  try {
    const data = await api({ op: "login", name: $("loginName").value, pin: $("loginPin").value });
    store.set("token", data.token);
    $("loginPin").value = "";
    start();
  } catch (err) {
    $("loginErr").textContent = err.message;
  } finally {
    $("loginBtn").disabled = false;
  }
});

function signOut() {
  store.del("token");
  state = null;
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}
$("signOut").addEventListener("click", signOut);

// ---- data -----------------------------------------------------------------------
async function load(auto = false) {
  lastLoad = Date.now();               // set before the call so a slow reply can't trigger a second one
  try {
    const data = await api({ op: "state", ...(auto ? { auto: true } : {}) });
    if (data.paused) return;            // Lambda: no automatic refresh 1-6 AM ET
    state = data;
    render();
  } catch (err) {
    if (store.get("token")) $("subline").textContent = "Couldn't refresh: " + err.message;
  }
}

function statusOf(task) {
  const m = state.marks[task.task_id];
  if (m && m.status !== "open") return m;
  // never marked before its lock / kickoff: closed as expired (not charged to anyone)
  if (task.expires_et && new Date(task.expires_et) < new Date() && task.kind !== "placeholder") return { status: "expired" };
  return null;
}
function isOverdue(task) {
  return !statusOf(task) && task.due_et && task.kind !== "placeholder" && task.kind !== "checklist"
    && new Date(task.due_et) < new Date();
}

// ---- actions --------------------------------------------------------------------
async function mark(taskId, status, asUser, decision) {
  try {
    const data = await api({ op: "mark", task_id: taskId, status, date: state.date, ...(asUser ? { as_user: asUser } : {}),
                             ...(decision ? { decision } : {}) });
    state.marks = data.marks;
    state.stats = data.stats;
    render();
  } catch (err) { alert(err.message); }
}

const FINAL = ["Success", "Failed", "Cancelled", "TimedOut", "Status check failed", "Started"];

async function runAction(taskId, action) {
  const key = taskId + "|" + action;
  running[key] = { status: "Starting…" };
  render();
  try {
    const data = await api({ op: "action", task_id: taskId, action, date: state.date });
    if (!data.command_id) {            // SimIQ: started, no status to poll (results post in Slack)
      running[key] = { status: "Started", stdout: data.text || "" };
      render();
      return;
    }
    running[key] = { command_id: data.command_id, status: "Running — checks every 60 s" };
    render();
    poll(key);
  } catch (err) {
    running[key] = { status: "Failed", stderr: err.message };
    render();
  }
}

async function poll(key) {
  const job = running[key];
  const started = Date.now();
  while (job && Date.now() - started < 30 * 60000) {
    await new Promise((r) => setTimeout(r, JOB_CHECK_MS));
    try {
      const data = await api({ op: "action_status", command_id: job.command_id });
      Object.assign(job, { status: data.status, stdout: data.stdout, stderr: data.stderr });
      render();
      if (["Pending", "InProgress", "Delayed", "Running", undefined, null].includes(data.status)) {
        job.status = (data.status || "Running") + " — checks every 60 s"; render(); continue;
      }
      return;
    } catch (err) {
      job.status = "Status check failed"; job.stderr = err.message; render(); return;
    }
  }
}

// ---- rendering ------------------------------------------------------------------
function resourceLinks(task) {
  const links = (task.resources || [])
    .map((r) => (typeof r === "string" ? { label: r, url: r } : r))
    .filter((r) => r && /^https?:\/\//i.test(r.url || ""))
    .map((r) => `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.label || r.url)}</a>`);
  return links.length ? `<div class="res">Resources: ${links.join(" · ")}</div>` : "";
}

// ---- steps pop-out: task.steps = ["step text (URLs become links)", ...] -------------
const stepsById = {};
function linkify(text) {
  return esc(text).replace(/https?:\/\/[^\s<)]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
}
function openSteps(id) {

}

             <button class="small" data-mark="open" data-task="${esc(task.task_id)}">Bring back</button>`
          : `<button class="small" data-mark="dismissed" data-task="${esc(task.task_id)}">Dismiss for today</button>`}

function taskCard(task) {
  if (task.kind === "checklist") return checklistCard(task);
  const m = statusOf(task);
  if (task.steps && task.steps.length) stepsById[task.task_id] = task;
  const overdue = isOverdue(task);
  const classes = ["task"];
  if (overdue) classes.push("overdue");
  if (task.kind === "critical") classes.push("critical");
  if (m) classes.push("closed", m.status === "done" ? "done" : "");
  const me = state.user;
  const expired = m && m.status === "expired";
  // news alerts: a person approves or rejects the alert (Chris, 2026-11-09); Slack needs no approval
  const approval = task.kind === "news" && !expired
    ? (m && m.status !== "open"
        ? `<span class="person closer ${m.decision === "rejected" ? "missed" : "done"}">${m.decision === "rejected" ? "✗ rejected" : "✓ approved"} by ${esc(m.user)} ${fmtTime(m.at_et)}</span>`
        : `<button class="person me" data-mark="done" data-decision="approved" data-task="${esc(task.task_id)}">Approve</button>
           <button class="person" data-mark="done" data-decision="rejected" data-task="${esc(task.task_id)}">Reject</button>`)
    : null;
  const people = approval !== null ? approval : expired ? `<span class="person">expired unmarked ${task.expires_et ? "at " + fmtTime(task.expires_et) : ""}</span>` : state.team.map((name) => {
    if (m && m.user === name) {
      const label = m.status === "done" ? "✓" : m.status === "skipped" ? "skipped" : "missed";
      return `<span class="person closer ${esc(m.status)}">${label} ${esc(name)} ${fmtTime(m.at_et)}${m.marked_by ? ` (by ${esc(m.marked_by)})` : ""}</span>`;
    }
    if (name === me && !m && task.kind !== "placeholder") {
      return `<button class="person me" data-mark="done" data-task="${esc(task.task_id)}">${esc(name)}</button>`;
    }
    if (state.admin && !m && task.kind !== "placeholder") {   // admin: mark done for anyone
      return `<button class="person" data-mark="done" data-as="${esc(name)}" data-task="${esc(task.task_id)}" title="Mark done for ${esc(name)}">${esc(name)}</button>`;
    }
    return `<span class="person">${esc(name)}</span>`;
  }).join("");
  const acts = task.kind === "placeholder" ? [] : (task.actions || (task.action ? [task.action] : []));
  const labels = (state && state.actions) || {};
  const actionBtn = acts.map((a) => {
    const job = running[task.task_id + "|" + a];
    const busy = job && !FINAL.includes(job.status);
    const line = job
      ? `<span class="astatus ${job.status === "Success" || job.status === "Started" ? "ok" : /Fail|Cancel|Timed/.test(job.status) ? "bad" : ""}">${esc(job.status)}</span>`
        + (job.stdout || job.stderr ? `<details><summary class="astatus">output</summary><pre>${esc((job.stdout || "") + (job.stderr ? "\n" + job.stderr : ""))}</pre></details>` : "")
      : "";
    return `<button class="action" data-action="${esc(task.task_id)}" data-act="${esc(a)}" ${busy ? "disabled" : ""}>${esc(labels[a] || "Run " + a)}</button>${line}`;
  }).join("");
  const jobLine = "";
  const secondary = expired ? ""
    : m
    ? `<button class="small" data-mark="open" data-task="${esc(task.task_id)}">Reopen</button>`
    : task.kind === "placeholder" ? ""
    : `<button class="small" data-mark="skipped" data-task="${esc(task.task_id)}">Skip</button>
       <button class="small" data-mark="missed" data-task="${esc(task.task_id)}">Missed</button>`
      + (state.admin && task.def_id === "adhoc" ? ` <button class="small" data-remove="${esc(task.task_id)}">Remove</button>` : "");
  // compact card (Chris, 2026-11-12): line 1 due + sport + name, line 2 note + links, line 3 every button
  const links = (task.resources || []).map((r) => (typeof r === "string" ? { label: r, url: r } : r))
    .filter((r) => r && /^https?:\/\//i.test(r.url || ""))
    .map((r) => `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.label || r.url)}</a>`);
  const sub = [task.note ? `<span class="note">${esc(task.note)}</span>` : "", links.join(" · ")].filter(Boolean);
  const stepsBtn = task.steps && task.steps.length ? `<button class="small" data-steps="${esc(task.task_id)}">Steps (${task.steps.length})</button>` : "";
  return `<div class="${classes.join(" ")} compact" style="--c:var(--sp-${LEAGUE_VAR[task.sport] || SPORT_VAR[task.sport] || "other"})">
    <div class="t1">
      <span class="due">${task.due_et ? fmtTime(task.due_et) : "no time"}</span>
      <span class="chip">${esc(task.sport)}</span>
      ${task.kind === "critical" ? '<span class="chip crit">CRITICAL</span>' : ""}
      ${overdue ? '<span class="chip crit">Overdue</span>' : ""}
      ${task.carried_from ? `<span class="chip">from ${esc(new Date(task.carried_from + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short" }))}</span>` : ""}
      ${expired ? '<span class="chip">EXPIRED</span>' : ""}
      <span class="name" title="${esc(task.category || "")}">${esc(task.name)}</span>
    </div>
    ${sub.length ? `<div class="t2 res">${sub.join(" · ")}</div>` : ""}
    <div class="t3">${people}${stepsBtn}${actionBtn}${jobLine}${secondary}</div>
  </div>`;
}

function taskList(tasks) {
  const open = tasks.filter((t) => !statusOf(t));
  const closed = tasks.filter((t) => statusOf(t));
  const critical = open.filter((t) => t.kind === "critical");
  const overdue = open.filter((t) => t.kind !== "critical" && isOverdue(t));
  const upcoming = open.filter((t) => t.kind !== "critical" && !isOverdue(t));
  let html = "";
  if (critical.length) html += `<h2 class="hot">Critical</h2>` + critical.map(taskCard).join("");
  if (overdue.length) html += `<h2 class="hot">Overdue</h2>` + overdue.map(taskCard).join("");
  html += `<h2>Up next</h2>` + (upcoming.length ? upcoming.map(taskCard).join("") : `<div class="empty">Nothing open.</div>`);
  html += `<h2>Closed (${closed.length}) <button class="linkbtn" id="toggleClosed">${showClosed ? "hide" : "show"}</button></h2>`;
  if (showClosed) html += closed.map(taskCard).join("") || `<div class="empty">None yet.</div>`;
  return html;
}

function scoreTable(title, people) {
  const rows = Object.entries(people || {}).sort((a, b) => b[1].done - a[1].done);
  if (!rows.length) return `<h2>${title}</h2><div class="empty">No marks yet.</div>`;
  return `<h2>${title}</h2><table><thead><tr><th>Person</th><th>Done</th><th>On time</th><th>Late</th><th>Missed</th><th>Skipped</th></tr></thead><tbody>`
    + rows.map(([name, r]) => `<tr><td>${esc(name)}</td><td>${r.done}</td><td>${r.on_time}</td><td>${r.late}</td><td>${r.missed}</td><td>${r.skipped}</td></tr>`).join("")
    + `</tbody></table>`;
}

let feedSport = "All";
function feedSection() {

function render() {
  if (!state) return;
  $("subline").textContent = `${fmtDate(state.now_et)} · signed in as ${state.user} · updated ${fmtTime(new Date().toISOString())}`;
  const tasks = state.tasks;
  const open = tasks.filter((t) => !statusOf(t) && t.kind !== "placeholder");
  const overdue = open.filter(isOverdue).length;
  const crit = open.filter((t) => t.kind === "critical").length;
  const done = tasks.filter((t) => statusOf(t)?.status === "done").length;
  $("summary").innerHTML =
    `<div class="stat ${overdue ? "bad" : ""}"><b>${overdue}</b><span>Overdue</span></div>` +
    `<div class="stat ${crit ? "bad" : ""}"><b>${crit}</b><span>Critical</span></div>` +
    `<div class="stat gold"><b>${open.length}</b><span>Open</span></div>` +
    `<div class="stat ok"><b>${done}</b><span>Done</span></div>`;
  $("addTaskBtn").classList.toggle("hidden", !state.admin);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  document.body.classList.toggle("wide", tab === "schedule" || (tab === "sport" && deskView === "columns")
    || (tab === "news" && newsView === "columns"));
  const openNews = tasks.filter((t) => t.kind === "news" && !statusOf(t)).length;
  $("newsCount").textContent = openNews ? ` (${openNews})` : "";

  let html = "";
  const work = tasks.filter((t) => t.kind !== "placeholder");
  if (tab === "all") {
    html = work.length ? taskList(work) : `<div class="empty" style="margin-top:16px">No tasks for today yet.</div>`;
  } else if (tab === "sport" && deskView === "columns") {
    html = `<div class="bar"><span class="seg"><button data-deskview="list">One sport</button>
      <button data-deskview="columns" class="on">Columns</button></span></div>` + sportColumns(work);
  } else if (tab === "sport") {
    html = `<div class="bar"><span class="seg"><button data-deskview="list" class="on">One sport</button>
      <button data-deskview="columns">Columns</button></span></div>`;
    const sports = [...new Set(work.map((t) => t.sport))].sort();
    if (!sports.includes(sportFilter)) sportFilter = sports[0] || "";
    html += `<div class="filters">${sports.map((s) => `<button data-sport="${esc(s)}" class="${s === sportFilter ? "on" : ""}">${esc(s)}</button>`).join("")}</div>`;
    const mine = tasks.filter((t) => t.sport === sportFilter);
    const news = mine.filter((t) => t.kind === "placeholder");
    html += taskList(mine.filter((t) => t.kind !== "placeholder"));
    if (news.length) html += `<h2>News</h2>` + news.map((t) => `<div class="empty">${esc(t.name)}</div>`).join("");
  } else if (tab === "news") {
    html = newsTab(tasks);
  } else if (tab === "nflreports") {
    html = nflReportsTab();
  } else if (tab === "schedule") {
    // built once; refreshes of the task data don't redraw it (keeps scroll position)
    if (!$("schedBody")) { $("main").innerHTML = scheduleShell(); renderSchedule(); }
    return;
  } else {
    html = scoreTable("Today", state.stats?.today?.people) + scoreTable(`All time (${state.stats?.all?.days || 0} days)`, state.stats?.all?.people);
  }
  const scrolls = {};   // keep each news column's scroll position across refreshes
  document.querySelectorAll("[data-colsport]").forEach((c) => { scrolls[c.dataset.colsport] = c.scrollTop; });
  const deskLeft = $("desk") ? $("desk").scrollLeft : 0;
  $("main").innerHTML = html;
  document.querySelectorAll("[data-colsport]").forEach((c) => { c.scrollTop = scrolls[c.dataset.colsport] || 0; });
  if ($("desk")) $("desk").scrollLeft = deskLeft;
}

// one delegated listener for every button on the board
document.addEventListener("click", (e) => {
  const el = e.target.closest("button");
  if (!el) return;
  if (el.dataset.tab) { tab = el.dataset.tab; store.set("tab", tab); render(); }
  else if (el.dataset.sport) { sportFilter = el.dataset.sport; store.set("sport", sportFilter); render(); }

  else if (el.dataset.mark) { mark(el.dataset.task, el.dataset.mark, el.dataset.as, el.dataset.decision); }

  else if (el.id === "toggleClosed") { showClosed = !showClosed; render(); }
});

// ---- schedule: timeline, day look-ahead, heat map --------------------------------
// Data: op "schedule" (one day) and op "heat" (all days).  Loaded when the tab / day / heat map is opened and
// kept for SCHED_CACHE_MS, so moving around costs no extra calls.  Times are ET.
const SCHED_CACHE_MS = 60 * 60000;
const PX_PER_HOUR = 96;
const labelW = () => (window.innerWidth < 600 ? 84 : 120);   // frozen league column
const LEAGUE_VAR = { NFL: "football", CFB: "football", NBA: "basketball", WNBA: "basketball", CBB: "basketball",
  NCAAB: "basketball", MLB: "baseball", NHL: "hockey", PGA: "golf", LIV: "golf", UFC: "mma", MMA: "mma", F1: "other",
  Tennis: "tennis", ATP: "tennis", WTA: "tennis", Soccer: "soccer", EPL: "soccer", SOC: "soccer", UCL: "soccer",
  MLS: "soccer", LoL: "other" };
const SPORT_VAR = { Football: "football", Basketball: "basketball", Baseball: "baseball", Hockey: "hockey",
  Soccer: "soccer", Golf: "golf", MMA: "mma", Tennis: "tennis" };   // others: grey
const sched = { day: null, cache: {}, sel: null, heat: null, heatAt: 0, showHeat: store.get("showHeat") === "1",
  metric: store.get("heatMetric") || "leagues", loading: false };
const etFmt = new Intl.DateTimeFormat("en-US", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
function etParts(d) {
  const p = Object.fromEntries(etFmt.formatToParts(d).map((x) => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: Number(p.hour) * 60 + Number(p.minute) };
}
const todayET = () => etParts(new Date()).date;
function addDays(iso, n) { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dayLabel(iso) { return new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" }); }
function hourLabel(h) { const x = ((h % 24) + 24) % 24; return x === 0 ? "12 AM" : x === 12 ? "12 PM" : x < 12 ? `${x} AM` : `${x - 12} PM`; }
// minutes from the viewed day's midnight ET (a 1 AM start the next day = 1500)
function minsOn(day, iso) {
  const p = etParts(new Date(iso));
  if (p.date === day) return p.min;
  if (p.date === addDays(day, 1)) return 1440 + p.min;
  return p.date < day ? -1 : 99999;
}
function teamLine(e) {
  if (e.kind === "card") return `${e.name}${e.main_event ? " — " + e.main_event : ""}${e.fight_count ? ` (${e.fight_count} fights)` : ""}`;
  return e.away && e.home ? `${e.away} @ ${e.home}` : e.name || "";
}

async function loadSchedule(day, force = false) {
  const hit = sched.cache[day];
  if (!force && hit && Date.now() - hit.at < SCHED_CACHE_MS) return hit.data;
  sched.loading = true;
  try {
    const data = await api({ op: "schedule", date: day });
    sched.cache[day] = { at: Date.now(), data };
    return data;
  } finally { sched.loading = false; }
}
async function loadHeat(force = false) {
  if (!force && sched.heat && Date.now() - sched.heatAt < SCHED_CACHE_MS) return sched.heat;
  sched.heat = await api({ op: "heat" });
  sched.heatAt = Date.now();
  return sched.heat;
}

async function openDay(day) {
  sched.day = day; sched.sel = null;
  const el = $("schedBody");
  if (el && !sched.cache[day]) el.innerHTML = `<div class="empty">Loading ${esc(dayLabel(day))}…</div>`;
  try { await loadSchedule(day); } catch (err) { if ($("schedBody")) $("schedBody").innerHTML = `<div class="empty">Couldn't load: ${esc(err.message)}</div>`; return; }
  renderSchedule();
}

function scheduleShell() {
  if (!sched.day) sched.day = todayET();
  return `<div class="bar">
      <button class="small" data-sday="-1" title="Previous day">◀</button>
      <span class="day" id="schedDay"></span>
